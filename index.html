<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>Lumen · 智能家居</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%235ea2fa' d='M12 2l2.4 7.6L22 12l-7.6 2.4L12 22l-2.4-7.6L2 12l7.6-2.4z'/%3E%3C/svg%3E">
<style>
/* ============ 设计系统 ============ */
:root{
  --bg:#0b1220; --surface:#141d31; --surface2:#1a2540; --brd:rgba(255,255,255,.07);
  --text:#e8edf7; --text2:#9aa8bd; --muted:#64748b;
  --accent:#5ea2fa; --accent2:#818cf8; --on-accent:#0b1220;
  --glow1:#3b82f6; --glow2:#8b5cf6; --glow-op:.16;
  --radius:24px; --shadow:0 14px 34px rgba(0,0,0,.45);
  --neo-d:transparent; --neo-l:transparent;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI Variable Display","Segoe UI","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei UI",sans-serif;
  background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;
  min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;transition:background-color .4s,color .4s;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(640px 440px at 86% -8%,color-mix(in srgb,var(--glow1) 62%,transparent),transparent 70%),
    radial-gradient(760px 540px at -12% 108%,color-mix(in srgb,var(--glow2) 58%,transparent),transparent 70%);
  opacity:var(--glow-op);
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font:inherit}
svg{display:block;flex:none}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:10px;height:8px}
::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--text) 16%,transparent);border-radius:99px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ============ 布局骨架 ============ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:254px;flex:none;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding:22px 16px 18px;border-right:1px solid var(--brd);
  background:color-mix(in srgb,var(--surface) 40%,transparent);backdrop-filter:blur(16px);
}
.side-logo{display:flex;align-items:center;gap:12px;padding:4px 8px 22px}
.logo-tile{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 40%,transparent);
}
.logo-name{font-size:18px;font-weight:800;letter-spacing:-.02em}
.logo-sub{font-size:11.5px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.side-nav{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;
  color:var(--text2);font-weight:600;font-size:14.5px;transition:.2s;width:100%;text-align:left;
}
.nav-item:hover{color:var(--text);background:color-mix(in srgb,var(--text) 6%,transparent)}
.nav-item.active{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.side-status{margin-top:auto;font-size:12.5px}
.ss-card{display:flex;align-items:center;gap:9px;padding:11px 13px;border-radius:14px;background:var(--surface2);border:1px solid var(--brd);color:var(--text2);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:#34d399;box-shadow:0 0 8px #34d39988}
.dot.off{background:#f87171;box-shadow:0 0 8px #f8717188}
.dot.wait{background:#fbbf24;box-shadow:0 0 8px #fbbf2488;animation:pulse 1.2s infinite}
.dot.demo{background:#38bdf8;box-shadow:0 0 8px #38bdf888}
@keyframes pulse{50%{opacity:.35}}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;
  background:color-mix(in srgb,var(--bg) 76%,transparent);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--brd);
}
.topbar-in{max-width:1240px;margin:0 auto;padding:18px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.tb-head{margin-right:auto}
.tb-head h1{font-size:23px;font-weight:800;letter-spacing:-.02em}
.tb-head p{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
.tb-search{
  display:flex;align-items:center;gap:9px;background:var(--surface2);border:1px solid var(--brd);
  border-radius:99px;padding:9px 16px;min-width:220px;color:var(--muted);transition:.2s;
}
.tb-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 16%,transparent)}
.tb-search input{background:none;border:none;outline:none;color:var(--text);width:100%;font-size:13.5px}
.tb-search input::placeholder{color:var(--muted)}
.tb-actions{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text2);
  background:var(--surface2);border:1px solid var(--brd);transition:.2s;
}
.icon-btn:hover{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,var(--brd));transform:translateY(-1px)}
.view{max-width:1240px;width:100%;margin:0 auto;padding:24px 28px 56px;flex:1}
.view section{margin-bottom:28px;animation:rise .45s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}}

/* ============ Hero ============ */
.hero{
  position:relative;overflow:hidden;border-radius:28px;padding:28px 30px;color:var(--on-accent);
  background:linear-gradient(130deg,var(--accent),var(--accent2));box-shadow:var(--shadow);
}
.hero::after{content:'';position:absolute;width:340px;height:340px;border-radius:50%;background:rgba(255,255,255,.16);top:-170px;right:-70px;filter:blur(6px)}
.hero::before{content:'';position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.1);bottom:-160px;left:-60px;filter:blur(6px)}
.hero-row{display:flex;justify-content:space-between;align-items:center;gap:16px;position:relative}
.hero-k{font-size:13px;font-weight:700;opacity:.85;letter-spacing:.02em}
.hero-temp{font-size:64px;font-weight:200;letter-spacing:-.04em;line-height:1.05;margin:6px 0 4px}
.hero-temp span{font-size:26px;font-weight:400;vertical-align:22px;opacity:.8}
.hero-meta{font-size:13.5px;font-weight:600;opacity:.85}
.hero-ic{color:var(--on-accent);opacity:.92}
.hero-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;position:relative}
.hchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);backdrop-filter:blur(8px);border-radius:13px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;color:inherit}
.hchip:hover{background:rgba(255,255,255,.34);transform:translateY(-1px)}
.hchip b{font-weight:800}
.hchip svg{opacity:.9}

/* ============ 区块 / 卡片 ============ */
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec-head h2{font-size:16.5px;font-weight:800;letter-spacing:-.01em}
.sec-head .cnt{font-size:12px;color:var(--muted);font-weight:700;background:var(--surface2);padding:3px 10px;border-radius:99px;border:1px solid var(--brd)}
.sec-more{margin-left:auto;font-size:13px;font-weight:600;color:var(--accent);cursor:pointer;background:none;display:inline-flex;align-items:center;gap:4px}
.sec-more:hover{text-decoration:underline}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(232px,1fr))}
.grid.rooms{grid-template-columns:repeat(auto-fill,minmax(206px,1fr))}

.card{
  position:relative;background:var(--surface);border:1px solid var(--brd);border-radius:var(--radius);
  padding:16px 16px 15px;transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s,opacity .3s;
}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--tg,var(--accent)) 28%,var(--brd))}
.card.na{opacity:.55}
.card-top{display:flex;align-items:flex-start;gap:12px}
.tile{
  width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--text) 8%,transparent);color:var(--muted);transition:.3s;
}
.tile.on{background:color-mix(in srgb,var(--tg,var(--accent)) 17%,transparent);color:var(--tg,var(--accent))}

/* ============ 状态特效层 ============ */
.fx{position:absolute;inset:0;pointer-events:none;overflow:hidden;border-radius:inherit;z-index:0}
.card>.card-top,.card>.ctl,.card>.c-more{position:relative;z-index:1}
/* 灯光：微光晕浮现 */
.fx-light{background:radial-gradient(ellipse 90% 55% at 18% 0%,color-mix(in srgb,var(--tg,#ffdca8) 22%,transparent),transparent 70%);animation:fxIn .8s ease}
@keyframes fxIn{from{opacity:0;transform:scale(.94)}}
/* 空调-制冷：雪花飘落 */
.fx-snow i{position:absolute;top:-8px;width:5px;height:5px;border-radius:50%;background:color-mix(in srgb,#a5d8ff 80%,#fff);box-shadow:0 0 8px #a5d8ff;animation:snowFall linear infinite}
.fx-snow i:nth-child(1){left:14%;animation-duration:3.4s}
.fx-snow i:nth-child(2){left:32%;animation-duration:4.6s;animation-delay:.9s;width:4px;height:4px}
.fx-snow i:nth-child(3){left:55%;animation-duration:3.9s;animation-delay:1.8s}
.fx-snow i:nth-child(4){left:71%;animation-duration:5.1s;animation-delay:.4s;width:3.5px;height:3.5px}
.fx-snow i:nth-child(5){left:86%;animation-duration:4.2s;animation-delay:2.4s}
@keyframes snowFall{0%{transform:translateY(-8px);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translateY(150px) translateX(10px);opacity:0}}
/* 空调-制热：热气上升 */
.fx-heat i{position:absolute;bottom:-6px;width:8px;height:8px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:color-mix(in srgb,#fb923c 60%,transparent);filter:blur(2px);animation:heatRise ease-in infinite}
.fx-heat i:nth-child(1){left:20%;animation-duration:2.6s}
.fx-heat i:nth-child(2){left:44%;animation-duration:3.3s;animation-delay:.8s}
.fx-heat i:nth-child(3){left:66%;animation-duration:2.9s;animation-delay:1.5s}
.fx-heat i:nth-child(4){left:84%;animation-duration:3.7s;animation-delay:.4s}
@keyframes heatRise{0%{transform:translateY(6px) rotate(-45deg) scale(.5);opacity:0}20%{opacity:.85}100%{transform:translateY(-120px) rotate(-45deg) scale(1.15);opacity:0}}
/* 风扇：旋转 + 气流线 */
.fx-fan .fan-spin{position:absolute;left:14px;top:14px;width:30px;height:30px;color:var(--tg,#7dd3fc);animation:fanSpin 1.1s linear infinite;opacity:.9}
@keyframes fanSpin{to{transform:rotate(360deg)}}
.fx-fan i{position:absolute;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,color-mix(in srgb,#7dd3fc 70%,transparent));animation:windBlow linear infinite}
.fx-fan i:nth-child(2){top:32%;left:8%;width:52px;animation-duration:1.8s}
.fx-fan i:nth-child(3){top:52%;left:4%;width:68px;animation-duration:2.3s;animation-delay:.5s}
.fx-fan i:nth-child(4){top:72%;left:12%;width:44px;animation-duration:2s;animation-delay:1s}
@keyframes windBlow{0%{transform:translateX(-20px);opacity:0}25%{opacity:.9}100%{transform:translateX(220px);opacity:0}}
/* 窗帘：开合帘布 */
.fx-curtain{position:absolute;top:0;bottom:0;width:12px;border-radius:3px;
  background:repeating-linear-gradient(90deg,color-mix(in srgb,var(--tg,#c9a876) 55%,transparent) 0 2.5px,color-mix(in srgb,var(--tg,#c9a876) 25%,transparent) 2.5px 4.5px);
  transition:left .8s cubic-bezier(.4,0,.2,1),opacity .5s;box-shadow:0 0 10px color-mix(in srgb,var(--tg,#c9a876) 30%,transparent)}
@media (prefers-reduced-motion:reduce){.fx{display:none!important}}
.c-info{flex:1;min-width:0}
.c-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-state{font-size:12.5px;color:var(--text2);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-state.on{color:var(--tg,var(--accent))}
.fav{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none;opacity:0;transition:.2s}
.card:hover .fav,.fav.act{opacity:1}
.fav:hover{color:#fbbf24;background:color-mix(in srgb,#fbbf24 12%,transparent)}
.fav.act{color:#fbbf24}
.fav.act svg{fill:#fbbf24}
.c-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:13px;min-height:36px}
.c-foot.btns{justify-content:flex-end;gap:8px}
.c-foot .temp{font-size:26px;font-weight:800;letter-spacing:-.03em}
.ib{
  width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;
  background:var(--surface2);color:var(--text2);border:1px solid var(--brd);transition:.2s;
}
.ib:hover{color:var(--tg,var(--accent));border-color:color-mix(in srgb,var(--tg,var(--accent)) 45%,var(--brd))}
.ib.accent{background:var(--tg,var(--accent));color:var(--on-accent);border-color:transparent}
.ib.accent:hover{filter:brightness(1.08);color:var(--on-accent)}
.c-val{display:flex;align-items:baseline;gap:5px;margin-top:10px}
.c-val b{font-size:25px;font-weight:800;letter-spacing:-.02em}
.c-val span{font-size:13px;color:var(--text2);font-weight:600}
.badge{display:inline-block;padding:6px 11px;border-radius:10px;font-size:12.5px;font-weight:700;margin-top:10px;background:color-mix(in srgb,var(--tg,var(--accent)) 15%,transparent);color:var(--tg,var(--accent))}

/* 开关（iOS 风格） */
.tgl{position:relative;width:47px;height:28px;flex:none;border-radius:99px;padding:0;
  background:color-mix(in srgb,var(--text) 15%,transparent);transition:background .25s}
.tgl::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.tgl[aria-checked="true"]{background:var(--tg,var(--accent))}
.tgl[aria-checked="true"]::after{transform:translateX(19px)}

/* 滑块 */
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl-head{display:flex;justify-content:space-between;font-size:12.5px;font-weight:600;color:var(--text2)}
.ctl-head b{color:var(--text);font-weight:700}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:99px;outline:none;cursor:pointer;
  background:linear-gradient(90deg,var(--tg,var(--accent)) var(--fill,50%),color-mix(in srgb,var(--text) 13%,transparent) var(--fill,50%))}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);transition:transform .15s}
.rng:active::-webkit-slider-thumb{transform:scale(1.18)}
.rng::-moz-range-thumb{width:18px;height:18px;border:none;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.c-more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.22,1,.36,1)}
.c-more>div{overflow:hidden;min-height:0}
.c-more-in{padding-top:13px;display:flex;flex-direction:column;gap:13px}
.card.open .c-more{grid-template-rows:1fr}
.swrow{display:flex;gap:9px;flex-wrap:wrap}
.sw-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid rgba(128,128,128,.35);transition:transform .18s}
.sw-dot:hover{transform:scale(1.16)}
.sw-dot.sel{outline:2.5px solid var(--tg,var(--accent));outline-offset:2px}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--surface2);
  border:1px solid var(--brd);color:var(--text2);transition:.2s;white-space:nowrap}
.chip:hover{color:var(--text)}
.chip.active{background:color-mix(in srgb,var(--accent) 15%,transparent);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* ============ 房间 / 场景 ============ */
.room{background:var(--surface);border:1px solid var(--brd);border-radius:var(--radius);padding:18px;cursor:pointer;
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s,border-color .25s}
.room:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:color-mix(in srgb,var(--accent) 30%,var(--brd))}
.room-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.room-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.room-t{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--accent)}
.room-t small{font-size:12px;font-weight:600;opacity:.75}
.room-name{font-size:15px;font-weight:700}
.room-sub{font-size:12.5px;color:var(--text2);font-weight:600;margin-top:2px}
.scrow{display:flex;gap:12px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.scrow::-webkit-scrollbar{display:none}
.scard{min-width:112px;background:var(--surface);border:1px solid var(--brd);border-radius:20px;padding:14px;cursor:pointer;
  transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s;text-align:left}
.scard:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.scard .stile{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;margin-bottom:10px;
  background:linear-gradient(135deg,var(--accent),var(--accent2))}
.scard .sname{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .ssub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}

/* ============ 设置 ============ */
.panel{background:var(--surface);border:1px solid var(--brd);border-radius:var(--radius);padding:22px}
.panel + .panel{margin-top:16px}
.frow{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.frow label{font-size:13px;font-weight:700;color:var(--text2)}
.input{width:100%;background:var(--surface2);border:1px solid var(--brd);border-radius:14px;padding:12px 15px;
  color:var(--text);font-size:14px;outline:none;transition:.2s}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3.5px color-mix(in srgb,var(--accent) 17%,transparent)}
.input::placeholder{color:var(--muted)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:14px;padding:11px 21px;font-size:14px;font-weight:700;
  color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));transition:.2s}
.btn:hover{transform:translateY(-1.5px);box-shadow:0 8px 22px color-mix(in srgb,var(--accent) 38%,transparent)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--brd)}
.btn.ghost:hover{box-shadow:none;border-color:color-mix(in srgb,var(--accent) 40%,var(--brd))}
.btn.sm{padding:8px 15px;border-radius:12px;font-size:13px}
.help{margin-top:16px;font-size:13px;color:var(--text2)}
.help summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:13px}
.help ol{padding-left:20px;margin-top:10px;display:flex;flex-direction:column;gap:5px}
.about p{font-size:13px;color:var(--text2);margin-top:8px;line-height:1.7}
.about b{color:var(--text)}
.banner{display:flex;align-items:center;gap:14px;border-radius:var(--radius);padding:16px 20px;margin-bottom:22px;
  background:color-mix(in srgb,var(--accent) 10%,var(--surface));
  border:1px solid color-mix(in srgb,var(--accent) 30%,var(--brd));animation:rise .45s both}
.banner .b-ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.banner p{flex:1;font-size:13.5px;font-weight:600;color:var(--text2)}

.sheet-panel{position:absolute;left:50%;bottom:0;transform:translate(-50%,40px);width:min(780px,96vw);max-height:84vh;
  overflow-y:auto;background:var(--surface);border:1px solid var(--brd);border-radius:28px 28px 0 0;
  padding:22px 24px 34px;opacity:0;transition:.4s cubic-bezier(.22,1,.36,1);box-shadow:var(--shadow)}
.sheet.show .sheet-panel{opacity:1;transform:translate(-50%,0)}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sheet-head h3{font-size:18px;font-weight:800;letter-spacing:-.01em}
.sheet-head .cnt{font-size:12px;color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 13%,transparent);padding:3px 10px;border-radius:99px}
.sheet-head .icon-btn{margin-left:auto;width:36px;height:36px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(106px,1fr));gap:13px;margin-top:16px}
.sw{display:flex;flex-direction:column;gap:7px;align-items:center;padding:0}
.sw-prev{width:100%;aspect-ratio:16/10.5;border-radius:15px;background:var(--sw-bg);position:relative;overflow:hidden;

.sw-prev::before{content:'';position:absolute;inset:0;background:radial-gradient(60px 44px at 82% -10%,color-mix(in srgb,var(--sw-g1) 55%,transparent),transparent 72%)}
.sw-card{position:absolute;left:11%;right:36%;top:24%;bottom:20%;border-radius:8px;background:var(--sw-sf);
  box-shadow:inset 0 0 0 1px rgba(128,128,128,.18)}
.sw-dotm{position:absolute;right:13%;top:26%;width:24%;aspect-ratio:1;border-radius:50%;background:var(--sw-ac)}
.sw:hover .sw-prev{transform:scale(1.045)}
.sw.active .sw-prev{outline:2.5px solid var(--accent);outline-offset:2.5px}
.sw-name{font-size:12px;font-weight:600;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.sw.active .sw-name{color:var(--accent);font-weight:800}
.tcats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* ============ 底部导航（移动） ============ */
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:50;display:none;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(20px);

/* ============ Toast ============ */
.toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,16px);z-index:90;opacity:0;pointer-events:none;
  background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);
  border:1px solid var(--brd);color:var(--text);padding:11px 19px;border-radius:15px;

.theme-glass .card,.theme-glass .room,.theme-glass .scard,.theme-glass .panel,
.theme-glass .topbar,.theme-glass .sidebar,.theme-glass .bottomnav,.theme-glass .sheet-panel,.theme-glass .banner{backdrop-filter:blur(22px)}
.theme-glass .tile,.theme-glass .ib,.theme-glass .chip,.theme-glass .room-ic,.theme-glass .icon-btn{backdrop-filter:blur(8px)}

/* ============ 卡片尺寸（密度） ============ */
body[data-density="compact"] .grid{grid-template-columns:repeat(auto-fill,minmax(162px,1fr));gap:10px}

.bento{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px}

const THEME_VARS=['--bg','--surface','--surface2','--brd','--text','--text2','--muted','--accent','--accent2','--on-accent','--glow1','--glow2','--glow-op'];
function applyTheme(t){
  const r=document.documentElement.style;
  THEME_VARS.forEach((k,i)=>r.setProperty(k,t.v[i]));
  r.setProperty('--radius',(t.r||24)+'px');
  r.setProperty('--shadow',t.d?'0 14px 34px rgba(0,0,0,.45)':'0 14px 34px rgba(15,23,42,.13)');
  r.setProperty('--neo-d',t.nd||'transparent');
  r.setProperty('--neo-l',t.nl||'transparent');
  document.body.classList.toggle('theme-glass',!!t.g);
  document.body.classList.toggle('theme-neo',!!t.neo);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=t.v[0];
  settings.themeId=t.id;store.set('lumen.settings',settings);
  document.querySelectorAll('.sw').forEach(el=>el.classList.toggle('active',el.dataset.theme===t.id));
}

function isOn(e){
  const d=e.domain,s=e.state;
  if(['light','switch','input_boolean','fan','humidifier','water_heater','siren','automation'].includes(d))return s==='on';
  if(d==='media_player')return s==='playing'||s==='on';
  if(d==='cover')return s==='open'||s==='opening';
  if(d==='climate')return s!=='off';
  if(d==='vacuum')return s==='cleaning'||s==='returning';
  if(d==='lock')return s==='unlocked';
  if(d==='person'||d==='device_tracker')return s==='home';
  return s==='on';
}
function stateLabel(e){
  const d=e.domain,s=e.state;
  if(s==='unavailable')return '不可用';
  if(s==='unknown')return '未知';
  if(d==='climate')return {off:'已关闭',heat:'制热',cool:'制冷',heat_cool:'智能模式',auto:'自动',dry:'除湿',fan_only:'送风'}[s]||s;
  if(d==='cover')return {open:'已打开',opening:'打开中',closed:'已关闭',closing:'关闭中'}[s]||s;
  if(d==='media_player')return {playing:'播放中',paused:'已暂停',idle:'空闲',standby:'待机',off:'已关闭',on:'已开启'}[s]||s;
  if(d==='lock')return s==='locked'?'已上锁':'未上锁';
  if(d==='vacuum')return {docked:'位于充电座',cleaning:'清扫中',paused:'已暂停',returning:'回充中',error:'故障',idle:'空闲'}[s]||s;
  if(d==='scene')return '轻点执行';
  if(d==='script')return '轻点运行';
  if(d==='automation')return s==='on'?'已启用':'已停用';
  if(d==='person'||d==='device_tracker')return s==='home'?'在家':'外出';
  if(d==='weather')return (COND[s]||[s])[0];
  if(d==='binary_sensor'){const m=BS_LABEL[e.attributes.device_class]||BS_LABEL._;return s==='on'?m[0]:m[1];}
  return (s==='on')?'已开启':'已关闭';
}
function entIcon(e){
  const d=e.domain;
  if(d==='sensor')return SENSOR_IC[e.attributes.device_class]||'activity';
  if(d==='binary_sensor')return BS_IC[e.attributes.device_class]||'activity';
  return dmeta(e).ic;
}
function tileColor(e){
  const d=e.domain,s=e.state;
  if(d==='lock')return s==='unlocked'?'#f87171':'#34d399';
  if(d==='binary_sensor')return s==='on'?'#fbbf24':'#94a3b8';
  return dmeta(e).c;
}

/* ================= Home Assistant WebSocket 客户端 ================= */
const WS={
  sock:null,nid:0,pending:new Map(),authed:false,manual:false,
  normUrl(u){
    u=(u||'').trim().replace(/\/+$/,'');
    if(u&&!/^https?:\/\//.test(u))u='http://'+u;
    return u;
  },
  connect(){
    const url=WS.normUrl(settings.url),token=(settings.token||'').trim();
    if(!url||!token)return Promise.reject(new Error('请先填写服务器地址与令牌'));
    connState='wait';paintStatus();
    return new Promise((res,rej)=>{
      let settled=false;
      let sock;
      try{sock=new WebSocket(url.replace(/^http/,'ws')+'/api/websocket');}
      catch(err){connState='fail';paintStatus();rej(err);return;}
      WS.sock=sock;
      const fail=msg=>{if(!settled){settled=true;connState='fail';paintStatus();try{sock.close()}catch{}rej(new Error(msg));}};
      const timer=setTimeout(()=>fail('连接超时'),8000);
      sock.onmessage=ev=>{
        let m;try{m=JSON.parse(ev.data)}catch{return;}
        if(m.type==='auth_required'){sock.send(JSON.stringify({type:'auth',access_token:token}));return;}
        if(m.type==='auth_ok'){clearTimeout(timer);WS.authed=true;settled=true;res();return;}
        if(m.type==='auth_invalid'){clearTimeout(timer);fail('令牌无效，请在 HA 个人资料页重新创建');return;}
        if(m.type==='result'){const p=WS.pending.get(m.id);if(p){WS.pending.delete(m.id);m.success?p.res(m.result):p.rej(new Error(m.error&&m.error.message||'调用失败'));}return;}
        if(m.type==='event'){handleEvent(m.event);return;}
      };
      sock.onclose=()=>{
        if(WS.authed){
          WS.authed=false;connState='off';paintStatus();
          if(!WS.manual){toast('连接已断开，5 秒后自动重连','err');setTimeout(()=>{if(!WS.manual&&settings.token)WS.connect().catch(()=>{});},5000);}
        }else fail('无法连接到服务器');
      };
      sock.onerror=()=>{};
    }).then(async()=>{
      connState='on';paintStatus();
      const states=await WS.call('get_states');
      ents.clear();
      states.forEach(s=>{if(s.state!=='removed')ents.set(s.entity_id,norm(s));});
      applyWhitelist();
      await WS.call('subscribe_events',{event_type:'state_changed'});
      demo=false;
      loadRegistry();
      renderAll();
      return true;
    });
  },
  call(type,extra){
    if(!WS.authed)return Promise.reject(new Error('未连接'));
    return new Promise((res,rej)=>{
      const id=++WS.nid;
      WS.pending.set(id,{res,rej});
      WS.sock.send(JSON.stringify({id,type,...extra}));
    });
  },
  service(domain,service,eid,data){
    return WS.call('call_service',{domain,service,target:{entity_id:eid},return_response:false,...(data?{service_data:data}:{})});
  },
  disconnect(){
    WS.manual=true;
    if(WS.sock)try{WS.sock.close()}catch{}
    WS.authed=false;connState='off';paintStatus();
  }
};
async function loadRegistry(){
  try{
    const ar=await WS.call('config/area_registry/list');
    areas.clear();ar.forEach(a=>areas.set(a.area_id,a.name));
    const er=await WS.call('config/entity_registry/list');
    entArea.clear();er.forEach(x=>{if(x.area_id)entArea.set(x.entity_id,x.area_id);});
    if(tab==='home'||tab==='devices')scheduleRender();
  }catch(err){/* 令牌权限不足时按域分组 */}
}
function handleEvent(ev){
  if(!ev||ev.event_type!=='state_changed')return;
  const {entity_id,new_state}=ev.data||{};
  if(WHITE_LIST.size&&!demo&&!WHITE_LIST.has(entity_id)&&entity_id.split('.')[0]!=='weather')return;
  if(!new_state){ents.delete(entity_id);}else{ents.set(entity_id,norm(new_state));}
  updateEntity(entity_id);
  if(tab!=='devices')scheduleRender();
}

function hasBrightness(e){
  const a=e.attributes,modes=a.supported_color_modes;
  if(modes&&modes.length)return !modes.every(x=>x==='onoff');
  return a.brightness!=null;
}
function hasKelvin(e){const a=e.attributes,modes=a.supported_color_modes;return modes?modes.includes('color_temp'):(a.color_temp_kelvin!=null);}
function hasColor(e){const a=e.attributes,modes=a.supported_color_modes;return !!modes&&modes.some(x=>['hs','rgb','rgbw','rgbww','rgbwvd','xy'].includes(x));}
function hasMore(e){
  const d=e.domain,a=e.attributes;
  if(d==='light')return hasBrightness(e)||hasKelvin(e)||hasColor(e);
  if(d==='climate')return (a.hvac_modes||[]).length>1;
  if(d==='cover')return a.current_position!=null;
  if(d==='fan')return a.percentage!=null;
  if(d==='humidifier')return true;
  if(d==='media_player')return a.volume_level!=null||a.media_title;
  return false;
}
function slider(eid,key,min,max,val,step){
  const pct=max>min?((val-min)/(max-min)*100):0;
  return `<input type="range" class="rng" data-slider="${key}" data-eid="${esc(eid)}" min="${min}" max="${max}" step="${step}" value="${val}" style="--fill:${pct}%" aria-label="${key}">`;
}
function row(label,inp,valText){
  return `<div class="ctl"><div class="ctl-head"><span>${label}</span><b data-val>${valText}</b></div>${inp}</div>`;
}
function moreHTML(e){
  const d=e.domain,a=e.attributes,eid=e.entity_id;const parts=[];
  if(d==='light'){
    if(hasBrightness(e)){
      const pct=a.brightness!=null?Math.round(a.brightness/255*100):(e.state==='on'?100:0);
      parts.push(row('亮度',slider(eid,'brightness_pct',1,100,pct,1),pct+'%'));
    }
    if(hasKelvin(e)){
      const min=a.min_color_temp_kelvin||2000,max=a.max_color_temp_kelvin||6500;
      const v=a.color_temp_kelvin||Math.round((min+max)/2);
      parts.push(row('色温',slider(eid,'kelvin',min,max,v,10),v+'K'));
    }
    if(hasColor(e)){
      const cur=Array.isArray(a.rgb_color)?a.rgb_color.join(','):null;
      parts.push(`<div><div class="ctl-head" style="margin-bottom:8px"><span>色彩</span></div><div class="swrow">${RGBS.map(c=>`<div class="sw-dot ${cur===c[0]?'sel':''}" style="background:${c[1]}" data-act="rgb" data-eid="${eid}" data-rgb="${c[0]}" title="${c[2]}"></div>`).join('')}</div></div>`);
    }
  }
  if(d==='climate'&&a.hvac_modes){
    parts.push(`<div><div class="ctl-head" style="margin-bottom:8px"><span>模式</span></div><div class="chiprow">${a.hvac_modes.map(x=>`<button class="chip ${x===e.state?'active':''}" data-act="hvac" data-eid="${eid}" data-mode="${x}">${HVAC[x]||x}</button>`).join('')}</div></div>`);
  }
  if(d==='cover'&&a.current_position!=null)
    parts.push(row('开合度',slider(eid,'position',0,100,Math.round(a.current_position),1),Math.round(a.current_position)+'%'));
  if(d==='fan'&&a.percentage!=null)
    parts.push(row('风速',slider(eid,'pct',0,100,Math.round(a.percentage),1),Math.round(a.percentage)+'%'));
  if(d==='humidifier'){
    const min=a.min_humidity??30,max=a.max_humidity??80,v=a.humidity??((min+max)/2);
    parts.push(row('目标湿度',slider(eid,'humidity',min,max,Math.round(v),1),Math.round(v)+'%'));
  }
  if(d==='media_player'){
    if(a.media_title)parts.push(`<div style="font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.media_title)}</div>${a.media_artist?`<div style="font-size:12px;color:var(--text2);font-weight:600">${esc(a.media_artist)}</div>`:''}`);
    if(a.volume_level!=null)parts.push(row('音量',slider(eid,'volume',0,1,Math.round(a.volume_level*100)/100,0.01),Math.round(a.volume_level*100)+'%'));
  }
  return parts.join('');
}

function updateEntity(eid){

  document.querySelectorAll(`[data-card="${cssEsc(eid)}"]`).forEach(n=>{
    if(!e){n.remove();return;}
    if(n.dataset.drag)return;
    const open=n.classList.contains('open'),room=n.dataset.ctx==='fav';

    const mode=e.state==='cool'?'snow':e.state==='heat'?'heat':'';
    if(!mode)return '';
    return `<div class="fx-${mode}"><i></i><i></i><i></i><i></i><i></i></div>`;
  }
  if(d==='cover'){
    const a=e.attributes;
    let pos=a.current_position??a.current_cover_position??50;
    const max=34;
    const inset=8+((100-pos)/100)*max;
    return `<div class="fx-curtain" style="left:${inset}%"></div>`;
  }
  return '';
}

const SLIDERS={
  brightness_pct:{d:'light',s:'turn_on',k:'brightness_pct'},
  kelvin:{d:'light',s:'turn_on',k:'color_temp_kelvin'},
  pct:{d:'fan',s:'turn_on',k:'percentage'},
  humidity:{d:'humidifier',s:'set_humidity',k:'humidity'},
  position:{d:'cover',s:'set_cover_position',k:'position'},
  volume:{d:'media_player',s:'volume_set',k:'volume_level'},
};
function sendSlider(eid,key,val){
  const cfg=SLIDERS[key],e=ent(eid);if(!e||!cfg)return;
  let service=cfg.s,data={[cfg.k]:val};
  if((key==='brightness_pct'||key==='pct')&&val<=0){service='turn_off';data={};}
  if(demo){applyDemoService(cfg.d,service,eid,data);return;}
  WS.service(cfg.d,service,eid,data).catch(err=>toast('设置失败：'+err.message,'err'));
}
const slideTimers=new Map();
/* ---- Bento 竖向滑块（pointer 拖拽） ---- */
let vslAct=null;
function vslFromEvent(t,ev){
  const r=t.getBoundingClientRect();
  const pct=clamp(Math.round((1-(ev.clientY-r.top)/r.height)*100),0,100);
  return pct;
}
function vslPaint(t,pct){
  const f=t.querySelector('.vsl-fill'),l=t.querySelector('.vsl-lab');
  if(f)f.style.height=pct+'%';
  if(l)l.textContent=pct<=0?'关':pct+'%';
}
document.addEventListener('pointerdown',ev=>{
  const t=ev.target.closest('.vsl');if(!t)return;
  ev.preventDefault();
  const card=t.closest('.bt');if(card)card.dataset.drag='1';
  vslAct={t,eid:t.dataset.eid,key:t.dataset.vsl};
  vslPaint(t,vslFromEvent(t,ev));
  try{t.setPointerCapture(ev.pointerId);}catch(_){/* ignore */}
},{passive:false});
document.addEventListener('pointermove',ev=>{
  if(!vslAct)return;
  const pct=vslFromEvent(vslAct.t,ev);
  vslPaint(vslAct.t,pct);
  clearTimeout(slideTimers.get('vsl'));
  slideTimers.set('vsl',setTimeout(()=>vslCommit(vslAct),280));
});
document.addEventListener('pointerup',()=>{
  if(!vslAct)return;
  clearTimeout(slideTimers.get('vsl'));
  vslCommit(vslAct);
  const card=vslAct.t.closest('.bt');
  if(card)setTimeout(()=>{delete card.dataset.drag;updateEntity(vslAct.eid);},600);
  vslAct=null;
});
function vslCommit(a){
  const pct=parseInt(a.t.querySelector('.vsl-fill').style.height)||0;
  const map={bri:'brightness_pct',fan:'pct',cov:'position'};
  sendSlider(a.eid,map[a.key],pct);
}

function valText(key,val){
  if(key==='kelvin')return Math.round(val)+'K';
  if(key==='volume')return Math.round(val*100)+'%';
  return Math.round(val)+'%';
}
function onSliderInput(t){
  const eid=t.dataset.eid,key=t.dataset.slider;
  const min=+t.min,max=+t.max,val=+t.value;
  t.style.setProperty('--fill',max>min?((val-min)/(max-min)*100)+'%':'0%');
  const card=t.closest('.card');if(card)card.dataset.drag='1';
  const lab=t.closest('.ctl')&&t.closest('.ctl').querySelector('[data-val]');
  if(lab)lab.textContent=valText(key,val);
  const tk=eid+':'+key;
  clearTimeout(slideTimers.get(tk));
  slideTimers.set(tk,setTimeout(()=>sendSlider(eid,key,val),320));
}
function onSliderChange(t){
  const eid=t.dataset.eid,key=t.dataset.slider,tk=eid+':'+key;
  clearTimeout(slideTimers.get(tk));
  sendSlider(eid,key,+t.value);
  const card=t.closest('.card');
  if(card)setTimeout(()=>{delete card.dataset.drag;updateEntity(eid);},600);
}
function applyDemoService(domain,service,eid,data={}){
  const e=ent(eid);if(!e)return;
  const a=e.attributes;
  const set=(id,st,attr)=>{const x=ent(id);if(!x)return;x.state=st;if(attr)Object.assign(x.attributes,attr);updateEntity(id);};
  if(domain==='scene'){
    if(eid==='scene.movie'){set('light.living_main','on');set('light.living_strip','on');set('cover.living_curtain','open',{current_position:70});}
    else if(eid==='scene.sleep'){['light.living_main','light.living_strip','light.kitchen','light.study_desk'].forEach(x=>set(x,'off'));set('cover.living_curtain','closed',{current_position:0});}
    else if(eid==='scene.reading')set('light.living_main','on',{brightness:180});
    else if(eid==='scene.away')[...ents.values()].filter(x=>(DOMAINS[x.domain]||{}).tg).forEach(x=>set(x.entity_id,'off'));
    toast('场景「'+e.name+'」已激活（演示）');
  }
  else if(domain==='script'||(domain==='automation'&&service==='trigger'))toast((domain==='script'?'脚本':'自动化')+'「'+e.name+'」已执行（演示）');
  else if(service==='turn_on'){
    e.state='on';
    if(domain==='light'){if(data.brightness_pct!=null)a.brightness=Math.round(data.brightness_pct*2.55);if(data.color_temp_kelvin!=null)a.color_temp_kelvin=data.color_temp_kelvin;if(a.brightness==null)a.brightness=128;}
    else if(domain==='fan'){if(data.percentage!=null)a.percentage=data.percentage;if(a.percentage==null)a.percentage=50;}
  }
  else if(service==='turn_off'){e.state='off';if(domain==='fan')a.percentage=0;}
  else if(service==='volume_set')a.volume_level=data.volume_level;
  else if(service==='set_temperature')a.temperature=data.temperature;
  else if(service==='set_hvac_mode')e.state=data.hvac_mode;
  else if(service==='set_cover_position'){a.current_position=data.position;e.state=data.position>0?'open':'closed';}
  else if(service==='set_humidity')a.humidity=data.humidity;
  else if(service==='set_percentage'){a.percentage=data.percentage;e.state=data.percentage>0?'on':'off';}
  else if(service==='lock')e.state='locked';
  else if(service==='unlock')e.state='unlocked';
  else if(service==='open_cover')set(eid,'open');
  else if(service==='close_cover')set(eid,'closed');
  updateEntity(eid);
  if(tab!=='devices')scheduleRender();
}
async function doConnect(){
  settings.url=$('#haUrl')&&$('#haUrl').value.trim()||settings.url;
  settings.token=$('#haToken')&&$('#haToken').value.trim()||'';
  store.set('lumen.settings',settings);
  if(!settings.token){toast('请先填写访问令牌','err');return;}
  toast('正在连接 '+WS.normUrl(settings.url)+' …');
  try{await WS.connect();toast('连接成功，已同步 '+ents.size+' 个实体');}
  catch(err){toast('连接失败：'+err.message,'err');}
}
function enableDemo(){loadDemo();connState='demo';renderAll();}

/* ================= 事件 ================= */
const searchDeb=debounce(v=>{
  query=v.trim().toLowerCase();
  if(query&&tab!=='devices'){domFilter='all';areaFilter='all';setTab('devices');}
  else renderView();
},160);

document.addEventListener('click',ev=>{
  const card=ev.target.closest('.card');
  if(card&&card.dataset.exp&&!ev.target.closest('button,input,[data-act]')){
    card.classList.toggle('open');return;
  }
  const el=ev.target.closest('[data-act]');
  if(!el)return;
  const act=el.dataset.act,eid=el.dataset.eid,e=eid?ent(eid):null;
  switch(act){
    case 'tab':setTab(el.dataset.tab);break;
    case 'palette':openSheet();break;
    case 'closeSheet':closeSheet();break;
    case 'tcat':themeCat=el.dataset.cat;renderThemeUI();break;
    case 'density':{settings.density=el.dataset.d;applyDensity(settings.density);store.set('lumen.settings',settings);renderView();break;}
    case 'theme':{const t=THEMES.find(x=>x.id===el.dataset.theme);if(t)applyTheme(t);break;}
    case 'toggle':toggleEntity(eid);break;
    case 'fav':toggleFav(eid);break;
    case 'call':{
      if(!e)break;const d=el.dataset.d||e.domain,s=el.dataset.s;
      if(demo)applyDemoService(d,s,eid);
      else WS.service(d,s,eid).then(()=>{if(['scene','script'].includes(d))toast('已执行「'+e.name+'」');}).catch(err=>toast('执行失败：'+err.message,'err'));
      break;}
    case 'tstep':{
      if(!e)break;const a=e.attributes,step=a.target_temp_step||0.5;
      const cur=a.temperature!=null?a.temperature:(a.min_temp||20);
      const v=clamp(Math.round((cur+(+el.dataset.dir)*step)*10)/10,a.min_temp??7,a.max_temp??35);
      if(demo)applyDemoService('climate','set_temperature',eid,{temperature:v});
      else WS.service('climate','set_temperature',eid,{temperature:v}).catch(()=>toast('设置失败','err'));
      break;}
    case 'hvac':{
      if(!e)break;
      if(demo)applyDemoService('climate','set_hvac_mode',eid,{hvac_mode:el.dataset.mode});
      else WS.service('climate','set_hvac_mode',eid,{hvac_mode:el.dataset.mode}).catch(()=>{});
      break;}
    case 'rgb':{
      if(!e)break;const rgb=el.dataset.rgb.split(',').map(Number);
      if(demo){e.attributes.rgb_color=rgb;updateEntity(eid);toast('已切换颜色（演示）');}
      else WS.service('light','turn_on',eid,{rgb_color:rgb}).catch(()=>{});
      break;}
    case 'cov':{if(!e)break;demo?applyDemoService('cover',el.dataset.s,eid):WS.service('cover',el.dataset.s,eid).catch(()=>{});break;}
    case 'lock':case 'unlock':{
      demo?applyDemoService('lock',act,eid):WS.service('lock',act,eid).catch(()=>toast('操作失败','err'));
      break;}
    case 'hfilter':
      domFilter=el.dataset.d||'all';areaFilter='all';query='';$('#searchInput').value='';
      setTab('devices');break;
    case 'room':
      areaFilter=el.dataset.area||'__none__';domFilter='all';query='';
      $('#searchInput').value='';setTab('devices');break;
    case 'afilter':areaFilter=el.dataset.id;renderView();break;
    case 'goff':{
      const rn=el.dataset.room;
      const targets=[...ents.values()].filter(e=>roomName(e.entity_id)===rn&&(DOMAINS[e.domain]||{}).tg&&e.domain!=='automation'&&isOn(e));
      targets.forEach(x=>{demo?applyDemoService(x.domain,'turn_off',x.entity_id):WS.service(x.domain,'turn_off',x.entity_id).catch(()=>{});});
      toast('已关闭 '+targets.length+' 个设备');
      break;}
    case 'dfilter':domFilter=el.dataset.id;renderView();break;
    case 'goto-devices':areaFilter='all';domFilter='all';setTab('devices');break;
    case 'goto-settings':setTab('settings');setTimeout(()=>{const i=$('#haToken');if(i)i.focus();},80);break;
    case 'connect':doConnect();break;
    case 'disconnect':WS.disconnect();enableDemo();toast('已断开连接');break;
    case 'demo':enableDemo();toast('已载入演示数据');break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='searchInput')searchDeb(t.value);
  else if(t.classList.contains('rng'))onSliderInput(t);
});
document.addEventListener('change',ev=>{
  if(ev.target.classList&&ev.target.classList.contains('rng'))onSliderChange(ev.target);
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeSheet();});

/* ================= 启动 ================= */
$('#paletteBtn').innerHTML=icon('palette',20);
$('#sheetClose').innerHTML=icon('x',18);
applyTheme(curTheme());
applyDensity(settings.density);
renderAll();
if(settings.url&&settings.token){
  WS.connect().catch(err=>{toast('连接失败：'+err.message+'，已切换到演示模式','err');enableDemo();});
}else enableDemo();


</script>
</body>
</html>
