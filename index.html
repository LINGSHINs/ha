<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Atmos Spatial — Home Assistant</title>
<style>
:root{
 --bg:#08090b;--fg:#f5f5f2;--muted:#858890;--dim:#555860;
 --line:rgba(255,255,255,.10);--glass:rgba(255,255,255,.055);
 --glass2:rgba(255,255,255,.095);--accent:#d9ff63;--accent2:#91a8ff;
 --glow:rgba(217,255,99,.22);--radius:30px;--blur:34px;--ease:cubic-bezier(.2,.8,.2,1);
 --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:var(--font)}
body{overflow:hidden;letter-spacing:-.01em}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.app{height:100dvh;display:grid;grid-template-columns:190px 1fr;position:relative;overflow:hidden}
.app:before{content:"";position:absolute;inset:-20%;pointer-events:none;background:
 radial-gradient(circle at 74% 30%,var(--glow),transparent 23%),
 radial-gradient(circle at 20% 90%,rgba(145,168,255,.08),transparent 27%);filter:blur(25px);opacity:.9;transition:all 1.2s var(--ease)}
.rail{position:relative;z-index:5;padding:30px 16px;border-right:1px solid var(--line);background:rgba(8,9,11,.36);backdrop-filter:blur(28px);display:flex;flex-direction:column}
.logo{padding:0 10px 28px}.logo .micro{font-size:9px;letter-spacing:.25em;color:var(--muted)}.logo strong{display:block;font-size:22px;letter-spacing:-.07em;margin-top:7px}
.rooms{display:flex;flex-direction:column;gap:3px}.room{border:0;background:transparent;text-align:left;padding:11px 12px;border-radius:15px;color:var(--muted);cursor:pointer;transition:.35s var(--ease);position:relative}
.room:hover{color:var(--fg);background:var(--glass)}.room.active{color:var(--fg);background:var(--glass2)}.room.active:before{content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;background:var(--accent);border-radius:3px;box-shadow:0 0 16px var(--accent)}
.railBottom{margin-top:auto;color:var(--muted);font-size:10px;padding:12px}.live{display:flex;align-items:center;gap:7px}.live i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.content{position:relative;z-index:2;min-width:0;overflow:auto;padding:28px 42px 50px}
.header{display:flex;justify-content:space-between;align-items:flex-start}.micro{font-size:10px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.roomName{font-size:clamp(42px,6vw,76px);line-height:.9;letter-spacing:-.075em;margin-top:8px;font-weight:650}.headerRight{display:flex;align-items:center;gap:9px}.pill{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:9px 13px;color:var(--muted);font-size:11px;cursor:pointer;backdrop-filter:blur(18px)}.pill:hover{color:var(--fg);background:var(--glass2)}
.stage{height:min(58vh,570px);min-height:390px;margin-top:30px;position:relative;border:1px solid var(--line);border-radius:46px;overflow:hidden;background:
 radial-gradient(circle at 54% 50%,rgba(255,255,255,.035),transparent 34%),
 linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.012));box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
.stage:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:radial-gradient(rgba(255,255,255,.055) .6px,transparent .6px);background-size:4px 4px;mask-image:linear-gradient(to bottom,transparent,black 35%,transparent)}
.spaceLabel{position:absolute;left:27px;top:24px;z-index:3}.spaceLabel b{font-size:12px;font-weight:500}.spaceLabel span{display:block;margin-top:5px;color:var(--muted);font-size:10px}
.floor{position:absolute;left:10%;right:10%;top:24%;bottom:17%;border:1px solid rgba(255,255,255,.08);transform:perspective(900px) rotateX(53deg);border-radius:35px;background:linear-gradient(135deg,rgba(255,255,255,.035),transparent);box-shadow:0 0 90px rgba(255,255,255,.025) inset}
.wall{position:absolute;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.018);border-radius:25px}.wall.tv{left:13%;top:27%;width:25%;height:18%}.wall.sofa{left:39%;top:49%;width:29%;height:20%}.wall.bar{right:12%;top:31%;width:18%;height:13%}.wall.corridor{right:10%;bottom:18%;width:13%;height:10%}
.node{position:absolute;z-index:4;border:0;background:transparent;cursor:pointer;text-align:center;transform:translate(-50%,-50%);min-width:80px}
.node .orb{margin:auto;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.045);display:grid;place-items:center;color:var(--muted);transition:.45s var(--ease);box-shadow:0 0 0 0 transparent}
.node:hover .orb{transform:scale(1.12);background:var(--glass2);color:var(--fg)}.node.on .orb{color:#12140c;background:var(--accent);border-color:var(--accent);box-shadow:0 0 42px var(--glow),0 0 0 10px color-mix(in srgb,var(--accent) 8%,transparent)}
.node .label{display:block;margin-top:9px;font-size:10px;color:var(--muted);white-space:nowrap}.node.on .label{color:var(--fg)}
.n-main{left:50%;top:32%}.n-tv{left:25%;top:34%}.n-bar{right:12%;top:47%}.n-sofa{left:48%;top:72%}.n-corridor{right:10%;bottom:13%}.n-curtain{left:78%;top:70%}
.bottomInfo{position:absolute;left:27px;right:27px;bottom:23px;z-index:5;display:flex;align-items:end;justify-content:space-between}.ambient{color:var(--muted);font-size:11px}.ambient strong{display:block;color:var(--fg);font-size:15px;margin-top:5px;font-weight:500}.clock{text-align:right;font-size:12px;color:var(--muted)}
.quick{display:flex;gap:9px;margin-top:13px;overflow:auto;padding-bottom:2px}.quickItem{border:1px solid var(--line);background:var(--glass);border-radius:999px;padding:10px 14px;white-space:nowrap;cursor:pointer;color:var(--muted);font-size:11px}.quickItem:hover{color:var(--fg);background:var(--glass2)}.quickItem.active{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.inspector{position:fixed;z-index:20;right:22px;bottom:22px;width:min(390px,calc(100vw - 44px));padding:22px;border:1px solid var(--line);border-radius:30px;background:rgba(18,19,22,.88);backdrop-filter:blur(36px);box-shadow:0 25px 90px rgba(0,0,0,.42);transform:translateY(25px);opacity:0;pointer-events:none;transition:.35s var(--ease)}.inspector.show{transform:none;opacity:1;pointer-events:auto}
.inspectorHead{display:flex;justify-content:space-between;align-items:start}.inspector h2{margin:5px 0 0;font-size:26px;letter-spacing:-.05em}.close{border:0;width:34px;height:34px;border-radius:50%;background:var(--glass);cursor:pointer}
.subnodes{display:flex;gap:8px;margin-top:19px;overflow:auto}.subnode{min-width:105px;border:1px solid var(--line);background:var(--glass);border-radius:18px;padding:13px;cursor:pointer}.subnode strong{font-size:12px}.subnode small{display:block;margin-top:6px;color:var(--muted);font-size:9px}
.sliderWrap{margin-top:18px}.sliderTop{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}.sliderTop b{color:var(--fg)}input[type=range]{width:100%;margin-top:10px;accent-color:var(--accent)}
.scenes{margin-top:30px}.scenesHead{display:flex;justify-content:space-between;align-items:end}.scenesHead h3{margin:0;font-size:18px;letter-spacing:-.04em}.scenesHead span{color:var(--muted);font-size:10px}.sceneList{display:flex;gap:9px;margin-top:12px;overflow:auto}.scene{min-width:135px;padding:15px;border:1px solid var(--line);border-radius:21px;background:var(--glass);cursor:pointer}.scene:hover{background:var(--glass2)}.scene b{font-size:12px;font-weight:500}.scene small{display:block;color:var(--muted);margin-top:6px;font-size:9px}
.modal{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.52);backdrop-filter:blur(14px);padding:18px}.modal.show{display:flex}.modalBox{width:min(900px,100%);max-height:90vh;overflow:auto;padding:25px;border:1px solid var(--line);border-radius:32px;background:rgba(18,19,22,.95)}.modalTop{display:flex;justify-content:space-between;align-items:start}.modalTop h2{margin:4px 0 0;font-size:30px;letter-spacing:-.06em}.themeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:20px}.theme{min-height:100px;border:1px solid var(--line);border-radius:18px;background:var(--glass);padding:13px;text-align:left;cursor:pointer}.theme:hover{background:var(--glass2)}.theme b{font-size:11px}.swatches{display:flex;gap:4px;margin-top:22px}.swatches i{display:block;width:15px;height:15px;border-radius:50%}
.connectBox{width:min(500px,100%)}.field{margin-top:14px}.field label{display:block;color:var(--muted);font-size:10px;margin-bottom:6px}.field input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:var(--glass);color:var(--fg);outline:none}.primary{width:100%;margin-top:14px;padding:13px;border:0;border-radius:15px;background:var(--accent);color:#111;font-weight:700;cursor:pointer}
.toast{position:fixed;z-index:60;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:rgba(18,19,22,.9);border:1px solid var(--line);backdrop-filter:blur(20px);padding:10px 15px;border-radius:999px;font-size:11px;transition:.3s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:900px){.app{grid-template-columns:78px 1fr}.rail{padding:22px 7px}.logo{padding:0 8px 24px}.logo .micro{display:none}.logo strong{font-size:16px}.room{font-size:0;text-align:center}.room:after{content:"•";font-size:20px}.room.active:before{left:0}.room span{display:none}.content{padding:22px 24px}.stage{height:58vh}.themeGrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:620px){.app{display:block}.rail{position:fixed;z-index:15;left:0;right:0;bottom:0;height:68px;border-right:0;border-top:1px solid var(--line);padding:7px;background:rgba(8,9,11,.78)}.logo,.railBottom{display:none}.rooms{flex-direction:row;overflow:auto}.room{min-width:64px;font-size:10px;padding:10px 5px}.room:after{display:none}.room span{display:block}.room.active:before{left:18px;right:18px;top:auto;bottom:4px;width:auto;height:2px}.content{padding:18px 14px 90px}.headerRight .pill:first-child{display:none}.roomName{font-size:48px}.stage{min-height:440px;height:62vh;border-radius:32px}.floor{left:5%;right:5%}.themeGrid{grid-template-columns:repeat(2,1fr)}.inspector{right:12px;bottom:78px;width:calc(100vw - 24px)}}
</style>
</head>
<body>
<div class="app">
<aside class="rail">
 <div class="logo"><div class="micro">SPATIAL HOME</div><strong>ATMO<span style="color:var(--accent)">S</span></strong></div>
 <nav class="rooms" id="rooms"></nav>
 <div class="railBottom"><div class="live"><i></i><span id="connectionText">DEMO</span></div></div>
</aside>
<main class="content">
 <header class="header">
  <div><div class="micro" id="day">MON · 28 SEP</div><div class="roomName" id="roomName">客厅</div></div>
  <div class="headerRight"><button class="pill" onclick="openConnect()">HA · 连接</button><button class="pill" onclick="openThemes()">THEMES · 30</button></div>
 </header>

 <section class="stage" id="stage">
  <div class="spaceLabel"><b id="spaceTitle">LIVING SPACE</b><span id="spaceMeta">光 · 温度 · 空气 · 窗</span></div>
  <div class="floor"></div>
  <div class="wall tv"></div><div class="wall sofa"></div><div class="wall bar"></div><div class="wall corridor"></div>
  <button class="node n-main on" id="node-main" onclick="shortNode('main')" onpointerdown="holdStart(event,'main')" onpointerup="holdEnd(event,'main')"><span class="orb">☼</span><span class="label">主照明</span></button>
  <button class="node n-tv" id="node-tv" onclick="shortNode('tv')"><span class="orb">◉</span><span class="label">电视氛围灯</span></button>
  <button class="node n-bar" id="node-bar" onclick="shortNode('bar')"><span class="orb">•</span><span class="label">吧台</span></button>
  <button class="node n-sofa" id="node-sofa" onclick="shortNode('sofa')"><span class="orb">•</span><span class="label">沙发</span></button>
  <button class="node n-corridor" id="node-corridor" onclick="shortNode('corridor')"><span class="orb">•</span><span class="label">走廊</span></button>
  <button class="node n-curtain" id="node-curtain" onclick="shortNode('curtain')"><span class="orb">║</span><span class="label">窗帘 72%</span></button>
  <div class="bottomInfo"><div class="ambient"><span id="ambientText">下午 · 自然光</span><strong id="ambientState">3 个光源正在工作</strong></div><div class="clock" id="clock">13:46</div></div>
 </section>

 <div class="quick" id="quick"></div>
 <section class="scenes"><div class="scenesHead"><h3>场景</h3><span>让房子自己完成一组动作</span></div>
  <div class="sceneList">
   <button class="scene" onclick="scene('回家')"><b>回家</b><small>玄关 → 客厅 → 空调</small></button>
   <button class="scene" onclick="scene('观影')"><b>观影</b><small>灯光 · 窗帘 · 氛围</small></button>
   <button class="scene" onclick="scene('晚安')"><b>晚安</b><small>全屋收束 · 主卧</small></button>
   <button class="scene" onclick="scene('离家')"><b>离家</b><small>一键收起整个家</small></button>
  </div>
 </section>
</main>
</div>

<div class="inspector" id="inspector">
 <div class="inspectorHead"><div><div class="micro" id="inspectEntity">LIGHT</div><h2 id="inspectTitle">主照明</h2></div><button class="close" onclick="closeInspector()">×</button></div>
 <div class="subnodes" id="subnodes"></div>
 <div class="sliderWrap" id="sliderWrap"><div class="sliderTop"><span>亮度</span><b id="sliderValue">72%</b></div><input id="brightness" type="range" min="1" max="100" value="72" oninput="brightnessChanged(this.value)"></div>
</div>

<div class="modal" id="themeModal" onclick="if(event.target===this)closeThemes()"><div class="modalBox"><div class="modalTop"><div><div class="micro">THEME ENGINE</div><h2>选择空间人格</h2></div><button class="close" onclick="closeThemes()">×</button></div><div class="themeGrid" id="themeGrid"></div></div></div>
<div class="modal" id="connectModal" onclick="if(event.target===this)closeConnect()"><div class="modalBox connectBox"><div class="modalTop"><div><div class="micro">HOME ASSISTANT</div><h2>连接你的家</h2></div><button class="close" onclick="closeConnect()">×</button></div><div class="field"><label>HA 地址</label><input id="haUrl" value="http://192.168.0.141:8123"></div><div class="field"><label>Long-Lived Access Token</label><input id="haToken" type="password" placeholder="粘贴 Token"></div><button class="primary" onclick="connectHA()">CONNECT & SYNC</button><p style="color:var(--muted);font-size:10px;line-height:1.6">浏览器直接连接局域网 HA。若浏览器阻止跨域请求，请通过同源反向代理或 HA 可接受的来源配置部署此页面。</p></div></div>
<div class="toast" id="toast"></div>

function renderRooms(){document.getElementById("rooms").innerHTML=rooms.map(r=>`<button class="room ${r===currentRoom?"active":""}" onclick="selectRoom('${r}')"><span>${r}</span></button>`).join("")}
function selectRoom(r){currentRoom=r;renderRooms();document.getElementById("roomName").textContent=r;document.getElementById("spaceTitle").textContent=({
"客厅":"LIVING SPACE","餐厅":"DINING SPACE","阳台":"BALCONY","主卧":"PRIMARY BEDROOM","主卫":"MASTER BATH","公卫":"GUEST BATH","儿童房":"KIDS ROOM","次卧":"GUEST BEDROOM","玄关":"ENTRY","多功能房":"STUDIO"
}[r]||"SPACE");renderQuick()}
function renderQuick(){let ds=DATA[currentRoom]||[];document.getElementById("quick").innerHTML=ds.map((d,i)=>`<button class="quickItem ${i===0?"active":""}" onclick="openDevice(${i})">${d[0]}</button>`).join("")}
function findEntity(id){return states[id]}
function shortNode(kind){
 const map={main:DATA["客厅"][0],tv:DATA["客厅"][1],bar:DATA["客厅"][0][3]?.[0],sofa:DATA["客厅"][0][3]?.[1],corridor:DATA["客厅"][0][3]?.[2],curtain:DATA["客厅"][8]};
 const d=map[kind];if(!d)return;
 if(kind==="main")openDevice(0);else if(ha)toggleEntity(d);else toast(`${d[0]} · Demo`);
}
function holdStart(e,kind){holdFired=false;holdTimer=setTimeout(()=>{holdFired=true;openDevice(0)},520)}
function holdEnd(e,kind){if(holdTimer){clearTimeout(holdTimer);holdTimer=null}if(holdFired){e.preventDefault();return}}
function openDevice(index){const d=(DATA[currentRoom]||[])[index];if(!d)return;currentDevice=d;document.getElementById("inspectTitle").textContent=d[0];document.getElementById("inspectEntity").textContent=d[1];let kids=d[3]||[];document.getElementById("subnodes").innerHTML=kids.length?kids.map((x,i)=>`<button class="subnode" onclick="selectChild(${i})"><strong>${x[0]}</strong><small>${x[2]==="light"?"亮度控制":"下一级"}</small></button>`).join(""):`<div style="color:var(--muted);font-size:10px;padding:10px 0">长按设备可进入更深一层；当前没有子设备。</div>`;document.getElementById("sliderWrap").style.display=(d[2]==="light"||kids.some(x=>x[2]==="light"))?"block":"none";document.getElementById("inspector").classList.add("show")}
function selectChild(i){const d=currentDevice?.[3]?.[i];if(!d)return;currentDevice=d;document.getElementById("inspectTitle").textContent=d[0];document.getElementById("inspectEntity").textContent=d[1];const kids=d[3]||[];document.getElementById("subnodes").innerHTML=kids.length?kids.map((x,j)=>`<button class="subnode" onclick="selectChild(${j})"><strong>${x[0]}</strong><small>下一层</small></button>`).join(""):`<button class="subnode" onclick="toggleEntity(currentDevice)"><strong>开 / 关</strong><small>${d[1]}</small></button>`;document.getElementById("sliderWrap").style.display=d[2]==="light"?"block":"none";if(d[2]==="light"){const s=states[d[1]];const b=s?.attributes?.brightness?Math.round(s.attributes.brightness/255*100):72;document.getElementById("brightness").value=b;document.getElementById("sliderValue").textContent=b+"%"}}
function closeInspector(){document.getElementById("inspector").classList.remove("show")}
function brightnessChanged(v){document.getElementById("sliderValue").textContent=v+"%";if(ha&&currentDevice)callService(currentDevice,"turn_on",{brightness_pct:+v})}
function toggleEntity(d){if(!d)return;if(d[2]==="climate"){toast("空调交互将在下一版升级为环形温控");return}if(d[2]==="cover"){toast("窗帘交互将在下一版升级为拖拽空间控制");return}if(ha)callService(d,"toggle");else toast(`${d[0]} · Demo toggle`)}
function scene(n){toast(`场景「${n}」 · 第一版预览`)}
function toast(t){const x=document.getElementById("toast");x.textContent=t;x.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.classList.remove("show"),1800)}
function updateClock(){const d=new Date();document.getElementById("clock").textContent=d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"});document.getElementById("day").textContent=d.toLocaleDateString("zh-CN",{weekday:"short",day:"2-digit",month:"short"}).toUpperCase()}
function openThemes(){document.getElementById("themeGrid").innerHTML=THEMES.map((t,i)=>`<button class="theme" onclick="applyTheme(${i})"><b>${String(i+1).padStart(2,"0")} · ${t[0]}</b><div class="swatches"><i style="background:${t[1]}"></i><i style="background:${t[2]}"></i><i style="background:${t[3]}"></i></div></button>`).join("");document.getElementById("themeModal").classList.add("show")}
function closeThemes(){document.getElementById("themeModal").classList.remove("show")}
function applyTheme(i){const t=THEMES[i];document.documentElement.style.setProperty("--bg",t[1]);document.documentElement.style.setProperty("--fg",t[2]);document.documentElement.style.setProperty("--accent",t[3]);document.documentElement.style.setProperty("--glow",t[3]+"35");localStorage.setItem("atmos-theme",i);toast(`空间人格 · ${t[0]}`)}
function openConnect(){document.getElementById("connectModal").classList.add("show")}function closeConnect(){document.getElementById("connectModal").classList.remove("show")}
async function connectHA(){const url=document.getElementById("haUrl").value.replace(/\/$/,"");const token=document.getElementById("haToken").value.trim();if(!token)return toast("请输入 Token");try{const r=await fetch(url+"/api/states",{headers:{Authorization:"Bearer "+token}});if(!r.ok)throw new Error(r.status);const arr=await r.json();arr.forEach(x=>states[x.entity_id]=x);ha={url,token};localStorage.setItem("atmos-ha",JSON.stringify({url,token}));connectWS();document.getElementById("connectionText").textContent="LIVE";closeConnect();renderQuick();toast("HA 已连接 · Live Sync")}catch(e){toast("连接失败 · 检查地址、Token 或跨域部署")}}
function connectWS(){if(!ha)return;const u=new URL(ha.url);u.protocol=u.protocol==="https:"?"wss:":"ws:";const ws=new WebSocket(u.origin.replace(/^http/,"ws")+"/api/websocket");ha.ws=ws;ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==="auth_required")ws.send(JSON.stringify({type:"auth",access_token:ha.token}));else if(m.type==="auth_ok"){document.getElementById("connectionText").textContent="LIVE";ws.send(JSON.stringify({id:1,type:"subscribe_events",event_type:"state_changed"}))}else if(m.type==="event"&&m.event?.event_type==="state_changed"){const x=m.event.data.new_state;states[x.entity_id]=x;syncVisuals()}};ws.onclose=()=>{document.getElementById("connectionText").textContent="OFFLINE";setTimeout(()=>ha&&connectWS(),3000)}}
function callService(d,service,data={}){if(!ha?.ws||ha.ws.readyState!==1)return toast("HA 尚未连接");ha.ws.send(JSON.stringify({id:Date.now(),type:"call_service",domain:d[2],service,data:{entity_id:d[1],...data}}));toast(`${d[0]} · ${service}`)}
function syncVisuals(){const s=states["light.mijia_cn_group_1889711912066113536_group3_s_2"];const on=s?.state==="on";document.getElementById("node-main").classList.toggle("on",on)}
(function init(){renderRooms();renderQuick();updateClock();setInterval(updateClock,1000);const t=localStorage.getItem("atmos-theme");if(t!==null)applyTheme(+t);const saved=localStorage.getItem("atmos-ha");if(saved){try{const x=JSON.parse(saved);document.getElementById("haUrl").value=x.url;document.getElementById("haToken").value=x.token}catch{}}})();
</script>
</body>
</html>
